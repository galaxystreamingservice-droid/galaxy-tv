name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Read version and name the APK
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "galaxy-setup-v$VER.apk"
          echo "Built galaxy-setup-v$VER.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyTVSetup-v${{ steps.ver.outputs.ver }}
          path: galaxy-setup-v${{ steps.ver.outputs.ver }}.apk

      - name: Publish release automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: Galaxy TV Setup v${{ steps.ver.outputs.ver }}
          files: galaxy-setup-v${{ steps.ver.outputs.ver }}.apk
          make_latest: true
