name: Unpack drop
# Upload into the drop/ folder (GitHub > Add file > Upload files, on the drop/ page) EITHER the version zip OR the
# version's app folder. This copies ONLY app/ files over the repo, clears drop/, commits, then starts the build for
# this branch (main = family release, any other branch = the HOME test pre-release that family sticks never see).
on:
  push:
    paths: ['drop/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the dropped app files into app/
        run: |
          set -e
          shopt -s nullglob dotglob
          [ -d drop ] || { echo "Nothing in drop/"; exit 0; }
          tmp=$(mktemp -d)
          for z in drop/*.zip; do echo "Unzipping $z"; unzip -q -o "$z" -d "$tmp"; done
          for f in drop/*; do case "$f" in *.zip) ;; *) cp -r "$f" "$tmp/" ;; esac; done
          # accept app/..., <folder>/app/..., or the inside of app/ (build.gradle.kts + src)
          src=$(find "$tmp" -maxdepth 3 -type d -name app | head -n 1)
          if [ -z "$src" ] && { [ -d "$tmp/src" ] || [ -f "$tmp/build.gradle.kts" ]; }; then src="$tmp"; fi
          [ -n "$src" ] || { echo "No app files in drop/"; exit 1; }
          echo "Copying from $src"
          cp -r "$src"/. app/
          git rm -rq drop
          git add app
          git config user.name "galaxy-drop"
          git config user.email "galaxy-drop@users.noreply.github.com"
          git commit -m "Unpack drop ($(date -u +%F' '%H:%M) UTC)"
          git push

      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh workflow run build.yml --ref main
          else
            gh workflow run build-home-test.yml --ref "$GITHUB_REF_NAME"
          fi
