name: Unpack drop
# One-zip upload: GitHub > open the drop/ folder (or upload to drop/) > Upload files > the zip > Commit.
# The zip holds app/... paths (exactly like the folders made for each version). This unpacks ONLY app/ files
# over the repo, removes the zip, commits, then starts the build for this branch (main = family release,
# any other branch = the HOME test pre-release that family sticks never see).
on:
  push:
    paths: ['drop/*.zip']

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app/ files from the zip
        run: |
          set -e
          shopt -s nullglob
          for z in drop/*.zip; do
            echo "Unpacking $z"
            tmp=$(mktemp -d); unzip -q -o "$z" -d "$tmp"
            # accept app/..., <folder>/app/..., or the inside of app/ (build.gradle.kts + src)
            src=$(find "$tmp" -maxdepth 3 -type d -name app | head -n 1)
            if [ -z "$src" ] && { [ -d "$tmp/src" ] || [ -f "$tmp/build.gradle.kts" ]; }; then src="$tmp"; fi
            [ -n "$src" ] || { echo "No app files inside $z"; exit 1; }
            cp -r "$src"/. app/
            git rm -q "$z"
          done
          git add app
          git config user.name "galaxy-drop"
          git config user.email "galaxy-drop@users.noreply.github.com"
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "Unpack drop ($(date -u +%F' '%H:%M) UTC)"
          git push

      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh workflow run build.yml --ref main
          else
            gh workflow run build-home-test.yml --ref "$GITHUB_REF_NAME"
          fi
